name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.8-beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      MYST_KEYSTORE_PATH: release.keystore
      MYST_KEYSTORE_PASSWORD: ${{ secrets.MYST_KEYSTORE_PASSWORD }}
      MYST_KEY_ALIAS: ${{ secrets.MYST_KEY_ALIAS }}
      MYST_KEY_PASSWORD: ${{ secrets.MYST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Permissão do wrapper
        run: chmod +x ./gradlew
      - name: Preparar keystore estável
        env:
          MYST_KEYSTORE_B64: ${{ secrets.MYST_KEYSTORE_B64 }}
        run: |
          if [ -n "$MYST_KEYSTORE_B64" ]; then
            printf '%s' "$MYST_KEYSTORE_B64" | base64 --decode > release.keystore
            chmod 600 release.keystore
            echo "Keystore estável preparada."
          else
            echo "::warning::MYST_KEYSTORE_B64 ausente; usando a chave de debug do runner. A atualização por cima exigirá reinstalação."
          fi
      - name: Build release mobile + tv
        run: |
          if [ -f release.keystore ] && [ -n "$MYST_KEYSTORE_PASSWORD" ]; then
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
            ./gradlew assembleMobileRelease assembleTvRelease --stacktrace --no-daemon
          else
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
            ./gradlew assembleMobileDebug assembleTvDebug --stacktrace --no-daemon
          fi
      - name: Verificar assinatura dos APKs
        if: env.APK_VARIANT == 'release'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/mobile/release/*.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/tv/release/*.apk
      - name: Preparar assets
        run: |
          cp app/build/outputs/apk/mobile/${{ env.APK_VARIANT }}/*.apk app.apk
          cp app/build/outputs/apk/tv/${{ env.APK_VARIANT }}/*.apk app-tv.apk
          sha256sum app.apk app-tv.apk > SHA256SUMS.txt
          echo "Assets:"
          ls -lh app.apk app-tv.apk SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MystMusic ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app.apk app-tv.apk SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease
          else
            gh release create "$RELEASE_TAG" app.apk app-tv.apk SHA256SUMS.txt \
              --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease
          fi
      - name: Conferir assets publicados
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --json tagName,isPrerelease,assets
