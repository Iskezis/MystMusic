name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.8-beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      MYST_KEYSTORE_PATH: release.keystore
      MYST_KEYSTORE_PASSWORD: ${{ secrets.MYST_KEYSTORE_PASSWORD }}
      MYST_KEY_ALIAS: ${{ secrets.MYST_KEY_ALIAS }}
      MYST_KEY_PASSWORD: ${{ secrets.MYST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Permissão do wrapper
        run: chmod +x ./gradlew
      - name: Preparar keystore estável
        env:
          MYST_KEYSTORE_B64: ${{ secrets.MYST_KEYSTORE_B64 }}
        run: |
          if [ -n "$MYST_KEYSTORE_B64" ]; then
            printf '%s' "$MYST_KEYSTORE_B64" | base64 --decode > release.keystore
            chmod 600 release.keystore
            echo "Keystore estável preparada."
          else
            echo "::warning::MYST_KEYSTORE_B64 ausente; usando a chave de debug do runner. A atualização por cima exigirá reinstalação."
          fi
      - name: Build release mobile
        run: |
          if [ -f release.keystore ] && [ -n "$MYST_KEYSTORE_PASSWORD" ]; then
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
            ./gradlew assembleMobileRelease --stacktrace --no-daemon --no-build-cache
          else
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
            ./gradlew assembleMobileDebug --stacktrace --no-daemon --no-build-cache
          fi
      # Variantes em invocações separadas: o Room exporta o mesmo
      # app/schemas/<versão>.json para os dois flavors e um cache antigo vazio
      # já quebrou a release. Sem cache de build e em sequência, o schema
      # versionado no repositório é a única fonte.
      - name: Build release tv
        run: |
          if [ "$APK_VARIANT" = "release" ]; then
            ./gradlew assembleTvRelease --stacktrace --no-daemon --no-build-cache
          else
            ./gradlew assembleTvDebug --stacktrace --no-daemon --no-build-cache
          fi
      - name: Validar schemas do Room
        run: |
          find app/schemas -name '*.json' -size 0 -print -quit | grep -q . && {
            echo "::error::Há schema do Room vazio em app/schemas; commite o schema exportado."
            exit 1
          }
          echo "Schemas do Room íntegros."
      - name: Verificar assinatura dos APKs
        if: env.APK_VARIANT == 'release'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/mobile/release/*.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/tv/release/*.apk
      - name: Preparar assets
        run: |
          cp app/build/outputs/apk/mobile/${{ env.APK_VARIANT }}/*.apk app.apk
          cp app/build/outputs/apk/tv/${{ env.APK_VARIANT }}/*.apk app-tv.apk
          sha256sum app.apk app-tv.apk > SHA256SUMS.txt
          echo "Assets:"
          ls -lh app.apk app-tv.apk SHA256SUMS.txt
      - name: Classificar canal da release
        run: |
          if printf '%s' "$RELEASE_TAG" | grep -Eqi '[-.](alpha|beta|rc|dev)([-.]?[0-9]+)?'; then
            echo "RELEASE_BETA=true" >> "$GITHUB_ENV"
            echo "Tag $RELEASE_TAG classificada como beta."
          else
            echo "RELEASE_BETA=false" >> "$GITHUB_ENV"
            echo "Tag $RELEASE_TAG classificada como estável."
          fi
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MystMusic ${RELEASE_TAG}"
          if [ "$RELEASE_BETA" = "true" ]; then
            CHANNEL_FLAGS=(--prerelease=true --latest=false)
          else
            CHANNEL_FLAGS=(--prerelease=false --latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app.apk app-tv.apk SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md \
              "${CHANNEL_FLAGS[@]}"
          else
            gh release create "$RELEASE_TAG" app.apk app-tv.apk SHA256SUMS.txt \
              --title "$TITLE" --notes-file RELEASE_NOTES.md "${CHANNEL_FLAGS[@]}"
          fi
      - name: Conferir assets publicados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,assets
          PRE=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)
          if [ "$PRE" != "$RELEASE_BETA" ]; then
            echo "::error::A release $RELEASE_TAG foi publicada com isPrerelease=$PRE; esperado $RELEASE_BETA para esta tag."
            exit 1
          fi
