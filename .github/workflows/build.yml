name: Build APKs
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Permissão do wrapper
        run: chmod +x ./gradlew
      - name: Build mobile + tv
        run: ./gradlew assembleMobileDebug assembleTvDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: myst-mobile-apk
          path: app/build/outputs/apk/mobile/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myst-tv-apk
          path: app/build/outputs/apk/tv/debug/*.apk
